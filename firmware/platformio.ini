; ============================================================================
;  AMBERSONG  -  THE ACTUAL FIRMWARE
;
;  This is the machine's own firmware, kept separate from the ad hoc test
;  sketches used during hardware bring-up.
;
;  Two environments, one per MCU, sharing include/ - the pin map and the
;  inter-MCU protocol are the same file for both by construction, not by
;  copy-paste. A pin map kept in two places drifts between them.
;
;  TOOLCHAIN: espressif32 @ 7.0.1 -> Arduino core 2.0.17 (IDF 4.4.7).
;  Pinned deliberately: core 3.x
;  (IDF 5) retires the legacy I2S API, and ESP32-A2DP then routes through
;  AudioTools instead of driving I2S directly. This project runs A2DP sink plus
;  I2S ADC capture plus I2S DAC output on one classic ESP32 (the converters are
;  Bible §6), and 2.0.17 is the best-trodden path for exactly that combination.
;
;  NEVER let PlatformIO auto-detect the upload port. Other ESP32-S3 boards may
;  be connected to the build PC and share VID:PID 303A:1001. Identify the
;  target by MAC first - the S3's is in the Hardware Bible §1, shown as SER= in
;  `pio device list`. Then pass --upload-port explicitly.
; ============================================================================

[platformio]
src_dir = src

[common]
framework       = arduino
platform        = espressif32@7.0.1
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
extra_scripts   = pre:scripts/version.py
build_flags     = -DCORE_DEBUG_LEVEL=3

; ---------------------------------------------------------------------------
;  MAIN MCU  -  ESP32-S3 N16R8 devkit (Bible §1)
;  Display, stepper, tuning encoder, RDA5807M, panel lighting, amp sense, WiFi
;  portal.
;
;  memory_type = qio_opi is REQUIRED for an N16R8. Getting it wrong fails
;  silently: the board boots and reports 0 MB PSRAM.
;
;  default_16MB.csv is already dual-OTA (app0/app1 at 6.25 MiB each), so the
;  S3 needs no partition migration - it can be updated over the air from the
;  first flash onward.
;
;  ARDUINO_USB_CDC_ON_BOOT=1 because the console is the S3's NATIVE USB port
;  (Bible §4). If it ever moves to the board's UART socket, set this to 0 or the
;  console goes nowhere visible.
; ---------------------------------------------------------------------------
[env:s3]
extends                         = common
board                           = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
build_src_filter                = +<s3/>
extra_scripts                   = pre:scripts/version.py
                                  pre:scripts/page.py
build_flags                     = ${common.build_flags}
                                  -DBOARD_HAS_PSRAM
                                  -DARDUINO_USB_CDC_ON_BOOT=1
                                  -DAMB_S3=1

; ---------------------------------------------------------------------------
;  AUDIO MCU  -  classic ESP32 devkit, "A32" (Bible §1)
;  A2DP sink, audio capture and output, source selector, DS3231 (Bible §5, §6).
;
;  THIS PARTITION TABLE MATTERS: min_spiffs.csv gives two 1.875 MB OTA slots,
;  where earlier development firmware used a single 3 MB app slot with no OTA
;  partition at all.
;
;  The v.1 A32 image is about 1.2 MB against a 1.875 MB slot. Comfortable.
;
;  NVS sits at 0x9000 in BOTH tables, so stored settings survived the migration.
;
;  A partition table cannot change over the air, so the move to this one took
;  one USB flash; after that the A32 is updated over the link from the S3.
; ---------------------------------------------------------------------------
[env:a32]
extends                = common
board                  = esp32dev
board_build.partitions = min_spiffs.csv
build_src_filter       = +<a32/>
build_flags            = ${common.build_flags} -DAMB_A32=1
;  PINNED to the exact commit that has been running (2026-08-12, library 1.8.11),
;  2026-09-25. Unpinned, a fresh clone or a wiped .pio fetched whatever the
;  library's main branch was that day - and the Bluetooth invisibility rule
;  (PolicyA2dpSink in src/a32/main.cpp) depends on its internals. Same rule as
;  the platform pin above: move it only on purpose, and re-test the scan policy.
;  Fetched from git, so it can be pinned to that exact commit.
lib_deps               = https://github.com/pschatzmann/ESP32-A2DP.git#3245602afc494f9e62160a0cfb2af864af45a37f
