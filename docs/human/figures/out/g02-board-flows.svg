<text xml:space="preserve" text-anchor="start" x="8.64" y="-372.49" font-family="Segoe UI" font-size="10.00">S3 → A32</text>
<text xml:space="preserve" text-anchor="start" x="8.64" y="-358.24" font-family="Segoe UI" font-size="10.00">• HELLO every second until answered; PING</text>
<text xml:space="preserve" text-anchor="start" x="8.64" y="-343.99" font-family="Segoe UI" font-size="10.00">• SET_SYS: amplifier on or off — at once, and every 2 s</text>
<text xml:space="preserve" text-anchor="start" x="8.64" y="-329.74" font-family="Segoe UI" font-size="10.00">• GET_TIME: at every handshake, then every 60 s</text>
<text xml:space="preserve" text-anchor="start" x="8.64" y="-315.49" font-family="Segoe UI" font-size="10.00">• SET_TIME: from network time, at most hourly; from the W prompt</text>
<text xml:space="preserve" text-anchor="start" x="8.64" y="-301.24" font-family="Segoe UI" font-size="10.00">• settings edits for the A32</text>
<text xml:space="preserve" text-anchor="start" x="8.64" y="-286.99" font-family="Segoe UI" font-size="10.00">• the A32&#39;s firmware, relayed in 1 KB acknowledged frames</text>
